<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GE Watch Settings</title>
  <style>
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: monospace;
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
    }
    h1 { color: #ff4444; font-size: 18px; letter-spacing: 2px; }
    h2 { color: #aaa; font-size: 13px; letter-spacing: 1px; margin-top: 24px; }
    .palette-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
    }
    .palette-btn {
      padding: 14px 8px;
      border: 2px solid #444;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      transition: border-color 0.2s;
    }
    .palette-btn.selected { border-color: #fff; }
    .color-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px 0;
    }
    .color-row label { flex: 1; font-size: 13px; color: #aaa; }
    input[type=color] {
      width: 48px; height: 36px;
      border: none; border-radius: 4px;
      cursor: pointer; background: none;
    }
    .save-btn {
      display: block;
      width: 100%;
      margin-top: 30px;
      padding: 16px;
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
    }
    .save-btn:active { background: #cc2222; }
    .divider {
      border: none;
      border-top: 1px solid #333;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>⚙ GE WATCH CONFIG</h1>

  <h2>PRESET PALETTES</h2>
  <div class="palette-grid" id="palettes"></div>

  <hr class="divider">

  <h2>CUSTOM COLOR</h2>
  <div class="color-row">
    <label>TEXT COLOR</label>
    <input type="color" id="custom_fg" value="#ff0000">
  </div>
  <div class="color-row">
    <label>BACKGROUND</label>
    <input type="color" id="custom_bg" value="#000000">
  </div>

  <button class="save-btn" onclick="save()">SAVE</button>

  <script>
    var palettes = [
      { name: "RED",    fg: "#ff0000", bg: "#000000" },
      { name: "GREEN",  fg: "#00ff00", bg: "#000000" },
      { name: "AMBER",  fg: "#ffaa00", bg: "#000000" },
      { name: "BLUE",   fg: "#00aaff", bg: "#000000" },
      { name: "WHITE",  fg: "#ffffff", bg: "#000000" },
      { name: "PAPER",  fg: "#000000", bg: "#ffffff" },
    ];

    var stored = localStorage.getItem('ge_watch_config');
    var config = stored ? JSON.parse(stored) : { fg: "#ff0000", bg: "#000000" };
    document.getElementById('custom_fg').value = config.fg;
    document.getElementById('custom_bg').value = config.bg;

    var grid = document.getElementById('palettes');
    palettes.forEach(function(p, i) {
      var btn = document.createElement('div');
      btn.className = 'palette-btn';
      btn.style.background = p.bg;
      btn.style.color = p.fg;
      btn.style.borderColor = (p.fg === config.fg && p.bg === config.bg) ? '#fff' : '#444';
      btn.textContent = p.name;
      btn.onclick = function() {
        document.querySelectorAll('.palette-btn').forEach(function(b) {
          b.style.borderColor = '#444';
        });
        btn.style.borderColor = '#fff';
        document.getElementById('custom_fg').value = p.fg;
        document.getElementById('custom_bg').value = p.bg;
      };
      grid.appendChild(btn);
    });

    document.getElementById('custom_fg').addEventListener('input', function() {
      document.querySelectorAll('.palette-btn').forEach(function(b) {
        b.style.borderColor = '#444';
      });
    });
    document.getElementById('custom_bg').addEventListener('input', function() {
      document.querySelectorAll('.palette-btn').forEach(function(b) {
        b.style.borderColor = '#444';
      });
    });

    function hexToGColor(hex) {
      var r = parseInt(hex.slice(1,3), 16);
      var g = parseInt(hex.slice(3,5), 16);
      var b = parseInt(hex.slice(5,7), 16);
      r = Math.round(r / 85);
      g = Math.round(g / 85);
      b = Math.round(b / 85);
      return (3 << 6) | (r << 4) | (g << 2) | b;
    }

    function save() {
      var fg = document.getElementById('custom_fg').value;
      var bg = document.getElementById('custom_bg').value;
      localStorage.setItem('ge_watch_config', JSON.stringify({ fg: fg, bg: bg }));
      var options = {
        FG_COLOR: hexToGColor(fg),
        BG_COLOR: hexToGColor(bg)
      };
      var location = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(options));
      document.location = location;
    }
  </script>
</body>
</html>
